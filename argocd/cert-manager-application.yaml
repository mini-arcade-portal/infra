# Issues and renews the Let's Encrypt certificates that terminate TLS for the
# portal and Grafana. Apply once with:
#
#   kubectl apply -f argocd/cert-manager-application.yaml
#
# ServerSideApply is required: cert-manager's CRDs are larger than the 262 kB
# Kubernetes allows in the last-applied-configuration annotation, so a
# client-side apply fails on them. The same limit bit us on kube-prometheus-stack.
#
# This manifest holds no secrets, so unlike the mini-arcade and monitoring
# Applications it lives in version control.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.1
    helm:
      values: |
        crds:
          enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
