apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: mini-arcade
    component: auth-service
spec:
  {{- if not .Values.autoscaling.enabled }}
  # Omitted while autoscaling is on, otherwise ArgoCD would keep resetting the
  # replica count the HorizontalPodAutoscaler just changed.
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app: mini-arcade
      component: auth-service
  template:
    metadata:
      labels:
        app: mini-arcade
        component: auth-service
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      containers:
        - name: auth-service
          image: {{ include "mini-arcade.image" (dict "registry" .Values.imageRegistry "repository" "auth-service" "tag" .Values.authService.tag) }}
          ports:
            - containerPort: {{ .Values.authService.port }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:{{ .Values.postgres.port }}/{{ .Values.postgres.databases.auth }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mini-arcade-secrets
                  key: postgres-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mini-arcade-secrets
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mini-arcade-secrets
                  key: jwt-secret
            - name: JWT_EXPIRATION_MS
              value: {{ .Values.authService.jwtExpirationMs | quote }}
          resources:
            {{- toYaml .Values.authService.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.authService.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.authService.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
