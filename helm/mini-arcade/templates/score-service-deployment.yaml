apiVersion: apps/v1
kind: Deployment
metadata:
  name: score-service
  labels:
    app: mini-arcade
    component: score-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mini-arcade
      component: score-service
  template:
    metadata:
      labels:
        app: mini-arcade
        component: score-service
    spec:
      containers:
        - name: score-service
          image: {{ include "mini-arcade.image" (dict "registry" .Values.imageRegistry "repository" "score-service" "tag" .Values.scoreService.tag) }}
          ports:
            - containerPort: {{ .Values.scoreService.port }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:{{ .Values.postgres.port }}/{{ .Values.postgres.databases.scores }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mini-arcade-secrets
                  key: postgres-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mini-arcade-secrets
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mini-arcade-secrets
                  key: jwt-secret
          resources:
            {{- toYaml .Values.scoreService.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.scoreService.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.scoreService.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
