apiVersion: v1
kind: Secret
metadata:
  name: mini-arcade-secrets
  labels:
    app: mini-arcade
type: Opaque
stringData:
  jwt-secret: {{ required "secrets.jwtSecret is required — pass it with --set secrets.jwtSecret=\"$(openssl rand -base64 64)\"" .Values.secrets.jwtSecret | quote }}
  postgres-user: {{ .Values.secrets.postgresUser | default "postgres" | quote }}
  postgres-password: {{ required "secrets.postgresPassword is required — pass it with --set secrets.postgresPassword=\"$(openssl rand -base64 32)\"" .Values.secrets.postgresPassword | quote }}
