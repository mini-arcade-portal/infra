# Image registry the app images are pulled from (GitHub Container Registry).
imageRegistry: ghcr.io/urgyan-balint
imagePullSecretName: ghcr-pull-secret
postgres:
  image: postgres:16
  storage: 1Gi
  port: 5432
  databases:
    auth: miniarcade_auth
    scores: miniarcade_scores
authService:
  tag: 8068de204c7e87d3832539731b2560f715ed2e74
  port: 8081
  jwtExpirationMs: "3600000"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
scoreService:
  tag: 8b6e0b5af39aec6fc5e79f2b6f117b5e831b226c
  port: 8082
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
gateway:
  tag: 3b048a0c9cb826659e87f74f9fe33adb4d8c5fe1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
frontend:
  tag: de8ed6578fa927efd4d7ee285fab10e433f4a993
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
ingress:
  enabled: true
  className: traefik
  host: 3.66.117.89.nip.io
  tls:
    enabled: false
    secretName: mini-arcade-tls
# Never commit real values here. Supply them at install time, e.g.:
#   helm install mini-arcade infra/helm/mini-arcade -n mini-arcade --create-namespace \
#     --set secrets.jwtSecret="$(openssl rand -base64 64)" \
#     --set secrets.postgresPassword="$(openssl rand -base64 32)"
secrets:
  jwtSecret: ""
  postgresUser: postgres
  postgresPassword: ""
