# Image registry the app images are pulled from (GitHub Container Registry).
imageRegistry: ghcr.io/urgyan-balint
imagePullSecretName: ghcr-pull-secret
postgres:
  image: postgres:16
  storage: 1Gi
  port: 5432
  databases:
    auth: miniarcade_auth
    scores: miniarcade_scores
authService:
  tag: latest
  port: 8081
  jwtExpirationMs: "3600000"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
scoreService:
  tag: latest
  port: 8082
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
gateway:
  tag: 74079ddc83e7887ee4f6e965f7e4442d5139d33f
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
frontend:
  tag: latest
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
ingress:
  enabled: true
  className: traefik
  host: mini-arcade.example.com
  tls:
    enabled: false
    secretName: mini-arcade-tls
# Never commit real values here. Supply them at install time, e.g.:
#   helm install mini-arcade infra/helm/mini-arcade -n mini-arcade --create-namespace \
#     --set secrets.jwtSecret="$(openssl rand -base64 64)" \
#     --set secrets.postgresPassword="$(openssl rand -base64 32)"
secrets:
  jwtSecret: ""
  postgresUser: postgres
  postgresPassword: ""
