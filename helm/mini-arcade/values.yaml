# Image registry the app images are pulled from. The packages are public, so no
# pull secret is needed.
imageRegistry: ghcr.io/urgyan-balint
postgres:
  image: postgres:16
  storage: 1Gi
  port: 5432
  databases:
    auth: miniarcade_auth
    scores: miniarcade_scores
authService:
  tag: 28aeba11044d914617021c6ef5ce7253e1c6308c
  port: 8081
  jwtExpirationMs: "3600000"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
scoreService:
  tag: 04f045c0c7746b6d132f7e3279d0ff6d493facf9
  port: 8082
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
gateway:
  tag: a49e16db9062a78008362e78e8a59bb0fb126d36
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
frontend:
  tag: 528d68d75574e6588759ce55d8eddcd17e1ebed1
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
ingress:
  enabled: true
  className: traefik
  host: arcade.urgyanbalintviktor.com
  tls:
    enabled: true
    # Cloudflare origin certificate, loaded into this Secret by hand — see README.
    secretName: mini-arcade-tls
# Ships the service dashboard to Grafana as a labelled ConfigMap, which the
# Grafana sidecar picks up automatically. Keeps the dashboard in version control
# instead of living only inside a Grafana pod with no persistent storage.
grafanaDashboard:
  enabled: true
  sidecarLabel: grafana_dashboard
# Horizontal pod autoscaling for the three Java services. Scales on CPU measured
# against each pod's CPU request, so tune the requests above from real load
# before turning this on. Enabling it also drops the fixed replica count from the
# Deployments, handing that field to the autoscaler.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 300
# Never commit real values here. Supply them at install time, e.g.:
#   helm install mini-arcade infra/helm/mini-arcade -n mini-arcade --create-namespace \
#     --set secrets.jwtSecret="$(openssl rand -base64 64)" \
#     --set secrets.postgresPassword="$(openssl rand -base64 32)"
secrets:
  jwtSecret: ""
  postgresUser: postgres
  postgresPassword: ""
